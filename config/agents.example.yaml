version: 2
mode: capability-first
minimum_agents_for_auto_routing: 3

# ---- Activation: when does this skill engage? ----
# mode:
#   global  -> always engaged for every task (simplest, costs a little more context)
#   keyword -> only engaged when the task text matches keywords below (token-saving default)
#   manual  -> engaged only when the user explicitly invokes it (most economical)
activation:
  mode: keyword
  match: any            # any = one signal enables; all = every keyword and pattern must hit
  case_sensitive: false
  # Plain substrings. Keep them UNAMBIGUOUS. A generic word that also appears in ordinary
  # requests ("编排" for k8s, "验收" for a QA report, "分工" for people, "verifier" for a
  # function parameter) causes false activation, and engaging on the wrong task is worse
  # than not engaging at all.
  # Only phrases that carry their own agent/model subject, or an unambiguous English term.
  # Ambiguous words (交接 / 独立核验 / 接力 / 报告-ish terms) are NOT here: they would bypass the
  # conjunction below and engage on pure human contexts ("帮我们交接一下工作"). They live in
  # patterns, where an agent subject and an act of coordinating are required.
  keywords:
    - multi-agent
    - multi agent
    - multiagent
    - multiple agents
    - agent orchestration
    - orchestration of agents
    - coordinate agents
    - single-writer
    - single writer
    - independent verification
    - verifier agent
    - agent handoff
    - 多agent
    - 多 agent
    - 多代理
    - 多智能体
    - agent协作
    - 智能体协作
    - 多agent协作
    - 多智能体协作
    - 换助手
    - 换个助手
    - 单写入者
  # Regular expressions for INTENT and spoken variants. These are what make the skill engage
  # on how a person describes the problem ("两个 AI 改同一个文件") instead of on the
  # vocabulary the skill itself uses. Deliberately single-quoted so YAML leaves the
  # backslashes alone.
  # Engagement by pattern is a CONJUNCTION, not a hit: a sentence must name an agent-ish subject
  # (agent_anchors) AND describe an act of coordinating (coordination_acts). Matching collaboration
  # verbs alone is how "两个实习生互相覆盖对方的代码" and "两个同事同时改同一个文件" engaged - they
  # are people, not agents - and enumerating comparison synonyms to catch the lookalikes is a race
  # that cannot be won. Requiring the subject is the structural fix.
  agent_anchors: [ai, agent, bot, 代理, 助手, 智能体, 大模型, 大语言模型, 模型, claude, gpt, gemini, copilot, deepseek, qwen, grok, llama, kimi, mistral, 通义, 文心, 豆包, 混元, 智谱]
  # The subject does not have to be an agent: verifying a software artifact is this skill's own
  # practice ("我们需要独立核验这个实现"), while "做一份独立核验报告" and "第三方独立复核项目" are
  # human QA/audit work and must stay silent. Naming the artifact is what separates them.
  # Artifact nouns that imply a verification context. 代码/改动/功能 are deliberately absent: they
  # pair with the human-overwrite patterns ("两个实习生互相覆盖对方的代码"), so admitting them as a
  # subject would let people back in through the artifact door.
  software_objects: [实现, 版本, 提交, 模块, 接口, 分支, 补丁, pr, pull request]
  # Deliberately NO generic work verbs (写/做/改/跑/编辑). They are amplifiers: "写一篇关于 AI
  # 助手如何协同的文章" and "选一个 AI 助手来写代码" both凑齐了 anchor+verb while being nothing of
  # the sort. Coordination is the signal, doing is not.
  coordination_acts: [一起, 一块儿, 同时, 共同, 协作, 协同, 配合, 分工, 分别, 各自, 各, 并行, 接力, 交接, 交接班, 核验, 复核, 互相, 覆盖, 冲突, 同一个文件, 同一份文件]
  patterns:
    # A plural count of agents counts only when it is about agents DOING something. "三个 AI 模型的
    # 对比评测" is a lookalike; "我要用三个 AI 一起做" is the real thing. The negative lookahead
    # covers the comparison nouns, including when a modifier ("AI 大模型") sits in between.
    - '(多|几|两|三|四|五|六|双|\d+)\s*个?\s*(ai|agent|bot|代理|助手|智能体|大模型|大语言模型|模型)(?!\s*(的|大?模型|大?语言模型|软件|产品|工具|平台|服务|对比|评测|测评|排名|价格|方案|供应商|公司))'
    # Agent word plus an act of collaborating. "一块儿" is how people actually say it.
    - '(ai|agent|bot|代理|助手|智能体|大模型|大语言模型)[^。！？,.，]{0,12}(一起|一块儿|同时|共同|协同|协作|配合|分别|各自|各|并行)'
    # People name the models, and a name pair alone proves nothing: it must sit next to an act of
    # collaborating, otherwise "Claude 和 GPT 哪个强" (a comparison) would engage.
    - '(claude|gpt|gemini|copilot|deepseek|qwen|grok|llama|kimi|mistral|通义|文心|豆包|混元|智谱)[^。！？,.，]{0,20}(和|与|跟|、)[^。！？,.，]{0,20}(claude|gpt|gemini|copilot|deepseek|qwen|grok|llama|kimi|mistral|通义|文心|豆包|混元|智谱)[^。！？,.，]{0,24}(一起|一块儿|同时|共同|协作|协同|配合|分别|各自|各|分工|并行|接力)'
    # "让 X 和 Y 一起" only counts when an agent-ish thing is being directed - otherwise it fires on
    # "让小明和小红一起写作业", which is two people, not two agents.
    - '(让|叫|请|用|派|安排)[^。！？,.，]{0,16}(ai|agent|bot|代理|助手|智能体|大模型|大语言模型|模型)[^。！？,.，]{0,24}(一起|一块儿|同时|共同|分别|各自|各|协作|协同|配合|分工|并行)'
    - '(换个?|再换个?|换一?个)\s*(助手|ai|agent|代理|大模型|模型|工具)'
    - '(互相|相互|彼此)\s*(覆盖|冲突|打架|撞车|改乱)'
    - '同一个文件|同一份文件'
    - '(同时|并行)\s*(改|写|编辑|动)'
    - '(agent|ai|代理|助手|智能体|大模型)[^。！？,.，]{0,10}(编排|分工|分配|调度|协同)'
    - '(独立|交叉|第三方|外部|另一个)\s*(核验|验证|复核|复验|检验|审查|签名)'
    - '(冲突|覆盖)(了|的)?\s*(代码|改动|文件|修改)'
    # Moved out of keywords: ambiguous on their own, safe once an agent subject is required.
    - '交接|交接班|接力干活'
    - '(独立|交叉|第三方|外部|另一个)\s*(核验|复核|复验|复检)'
  # A request to compare, evaluate or choose between models/assistants is NOT orchestration, no
  # matter how many agent words it contains. The veto is sentence-level and only fires when the
  # sentence carries no collaboration signal of its own, so "让两个 agent 分别改，再对比结果"
  # (real work that happens to include a comparison) still engages.
  comparison_veto:
    comparison_words: [对比, 评测, 测评, 区别, 差异, 优缺点, 选型, 排名, 性价比, 哪个, 哪一个, 哪个更]
    collaboration_words: [一起, 一块儿, 同时, 共同, 协作, 协同, 配合, 分工, 分别, 各自, 各, 并行, 接力]
    # The escape hatch above can be turned against the veto: "对比这两个 AI 助手的协同能力" is a
    # comparison in which the compared ATTRIBUTE happens to be collaboration, so 协同 released the
    # veto. A collaboration word sitting directly in front of one of these nouns is an attribute
    # being described, not an act of coordinating, and does not count as an escape.
    attribute_nouns: [能力, 效率, 效果, 表现, 水平, 质量, 差距, 优劣, 程度, 方式, 机制, 模式, 价值, 收益]
  exclude_keywords:     # a veto: if any of these appear, do NOT engage even when a signal hit
    - just a question
    - 闲聊
    - 随便聊聊

state:
  path: .agent-work/state.json
  lock_path: .agent-work/locks

# ---- Intake gate: ask before the first write/dispatch/verification of an important task ----
# Never default these on the user's behalf. The gate decides HOW work is coordinated;
# it does not authorize irreversible actions.
# The values below are the ENGINE's vocabulary, not a yes/no phrasing: the queue stores
# "planned" | "skip" (a planned scan is not a started scan) and "single" | "collaborative".
# Ask the user in plain words; record the mechanical value.
intake_gate:
  required_for: [important, critical]
  questions:
    - execution_mode: [single, collaborative]
    - security_scan: [planned, skip]
    - independent_verification: [planned, skip]
  record_to: shared task record AND task.startChoices

risk:
  default: routine
  important_triggers:
    - user_labels_task_important
    - modifies_user_facing_behavior
    - touches_shared_configuration
    - external_action_requested
    - multi_file_or_architecture_change
    - cross_agent_collaboration
  critical_triggers:
    - production_or_irreversible_change
    - security_or_privacy_impact
    - financial_or_legal_impact
    - data_migration_or_deletion
    - user_labels_task_critical
  important_pipeline: [specify, implement, verify, evidence, accept]
  critical_pipeline: [specify, implement, verify, domain_review, evidence, accept, approval]

roles:
  coordinator: { required: true, min_score: 1 }
  implementer: { required_for: [build, fix, migrate] }
  verifier:
    required_for: [important, critical]
    independent: true        # verifier != implementer, always
  environment_specialist: { required_for: [environment_failure] }
  domain_reviewer: { required_for: [critical] }

ownership:
  one_primary_writer_per_resource: true
  reviewers_may_write_shared_resources: false
  reviewers_may_write_isolated_artifacts: true
  on_conflict: stop_and_prefer_task_record     # the human-readable handoff record outranks the queue

# ---- Roster: who can do what, how well, at what cost (any size, any names) ----
# Data, not code: three agents work, and so do five or twelve. The ids below are
# deliberately not generalist/frontend/specialist, to show that any name is routable.
# The queue CLI reads the JSON form of this block: init --roster my-team.json
roster:
  agents:
    planner:  { cost: 2, available: true, specialties: [],       scores: { specify: 3, triage: 1, implement: 1, verify: 1, evidence: 3, environment: 1 } }
    builder:  { cost: 4, available: true, specialties: [full],   scores: { specify: 1, triage: 1, implement: 3, verify: 1, evidence: 1, environment: 1 } }
    webhand:  { cost: 5, available: true, specialties: [web],    scores: { specify: 1, triage: 1, implement: 2, verify: 1, evidence: 1, environment: 2 } }
    auditor:  { cost: 6, available: true, specialties: [verify], scores: { specify: 1, triage: 1, implement: 1, verify: 3, evidence: 2, environment: 1 } }
    scribe:   { cost: 1, available: true, specialties: [],       scores: { specify: 1, triage: 0, implement: 1, verify: 0, evidence: 3, environment: 0 } }
  routes:                     # optional: a stage named here is owned outright; anything omitted falls back to the scores
    specify: planner
    evidence: scribe
    implement: { build: builder, web: webhand }


# ---- Handoff: how state survives a change of agent, session or tool ----
# These four files live in one directory every agent can read and write. The record is
# the authority on intent; the queue below is only the scheduler.
handoff:
  record_dir: <shared-dir>            # e.g. a directory outside the repo, shared by all agents
  files: [CURRENT-TASK.md, HANDOFF-RULES.md, MEMORY-SNAPSHOT.md, AGENT-ROLES.md]
  iron_rules:
    - read_before_acting
    - resume_not_redo
    - write_progress_down
    - handoff_before_switching
    - completion_carries_graded_evidence
  record_outranks_queue: true
  blocked_after_rounds: 3             # a stuck task names its condition; only then may it be blocked
  memory_sync: periodic               # refresh the shared snapshot on a schedule or on big decisions


# ---- Machine-readable queue (optional companion script) ----
queue:
  enabled: false
  script: scripts/orchestrator/orchestrator.mjs
  state_file: TASK-QUEUE.json
  stages: [specify, triage, implement, verify, evidence, done]  # triage is inserted only for environment tasks
  extra_states: [blocked, recovery]
  dispatch_mode: dry_run        # print the command; never launch an agent
  non_dispatchable_exit_code: 2 # never disguise an undispatchable task as exit 0
  capabilities: [full, web, complex, verify, environment]

approval:
  external_actions: [deploy, publish, send, upload, delete, production_change, account_change]
  require_explicit_user_confirmation: true
  record_in: queue.approve        # task + scope, traceable to the user's confirmation
  verification_does_not_authorize_shipping: true

# ---- Verification gate: a FAIL blocks done until a pass or a recorded override ----
# The verifier is the highest-scoring eligible agent for verify, and the implementer is
# excluded. If the best eligible candidate scores 0, the run fails closed.
verification_gate:
  verifier_selection: capability_score
  implementer_excluded: true
  unscored_verifier: fail_closed
  failure_requires: criteria_or_findings   # a FAIL must say what failed
  on_failure: return_to_implement          # the verifier never fixes the work itself
  blocked_effects: [complete_to_done, dispatch_to_evidence]
  soft_override: true                      # a human may pass a blocked gate deliberately
  override_requires: [approvedBy, scope, reason]
  override_available_when: blocked
  override_keeps_failure_record: true      # status stays failed; the override sits beside it
  override_is_not_evidence: true           # an override is a decision, not a passing verification


# ---- Rigor: how much verification a change carries, chosen from its blast radius ----
# The engine stores this per task (create --rigor). The values below are the engine's
# vocabulary; see references/verification-standard.md for why the levels exist.
rigor:
  default: L2
  levels:
    - { id: L1, name: local,         requires: [tests_for_the_change] }
    - { id: L2, name: shared,        requires: [tests_for_the_change, independent_verifier, negative_cases] }
    - { id: L3, name: consequential, requires: [independent_verifier, machine_produced_artifact, approval_record, e1_evidence, kept_failure_record] }
  irreversible_requires: L3         # an external action can never be filed as local

evidence:
  # The engine's grade enum, not a description of it. A bare string is stored as E3 and
  # labelled, so self-report can never be mistaken for a reproducible result.
  grading: [E1, E2, E3, E4]
  e1_requires: [command, exitCode, revision]
  require_grade_label: true
  re_verify_after_context_compaction: true
  forbidden_phrasings:
    - treating a self-check as an independent verification
    - restating an old "verified" without this round's evidence

cost:
  default_tier: standard
  tiers: { micro: 2, standard: 4, high_assurance: 6 }
  cheap_model_for: [discover, extract, format, mechanical_check]
  strong_model_for: [ambiguity, architecture, adversarial_review, acceptance]
  max_retries_per_stage: 1
  require_cost_report: true
