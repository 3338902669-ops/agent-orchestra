name: validate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: a mutable tag lets upstream change the code that runs
      # with this repository's token. SHA resolved from the v4 tag on 2026-10-01.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      # One command, one definition of "checked": CI and a local machine run exactly this.
      # The runner self-tests first (it injects known-bad config and requires rejection), so a
      # gate that quietly stopped checking anything fails instead of reporting green.
      # An independent reviewer unpacked the ZIP and found install.sh with CRLF endings, which bash
      # refuses. The gate checks the working tree; this checks the file the way a user receives it.
      - name: Shell scripts parse on a fresh checkout
        run: |
          bash -n scripts/install.sh
          echo "install.sh parses"
      # Parsing is not installing. The Windows installer failed on a target that did not exist yet and
      # installed only part of the skill; this runs the shell one for real, where bash exists.
      - name: The shell installer actually installs
        run: |
          bash scripts/install.sh -t /tmp/ao-install
          test -f /tmp/ao-install/scripts/check-handoff.mjs
          node /tmp/ao-install/scripts/check-handoff.mjs --dir /tmp/ao-install/examples/handoff
          echo "install.sh installed a working skill"
      - name: The light mode installs the prompt skill only
        run: |
          bash scripts/install.sh -t /tmp/ao-install-light -m light
          test -f /tmp/ao-install-light/SKILL.md
          test ! -e /tmp/ao-install-light/scripts
          echo "light mode is prompt-only, as documented"
      - name: Run the gate
        run: node scripts/gate.mjs --evidence evidence
      - name: Show the evidence record
        if: always()
        run: cat evidence/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gate-evidence
          path: evidence/latest.json
          if-no-files-found: warn
